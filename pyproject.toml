[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "squid"
version = "0.1.0"
description = "Locally running chat agent with access to Claude Code, Codex, and bash"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "curl-cffi>=0.7.0",
    "browser-cookie3>=0.19.0",
]

[project.scripts]
squid = "agent.server:app"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "pytest-asyncio",
]
