[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentsquid"
version = "0.1.2rc1"
description = "Locally running chat agent with access to Claude Code, Codex, and bash"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Haebin Na" },
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "curl-cffi>=0.7.0",
    "browser-cookie3>=0.19.0",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://agentsquid.ai"
Repository = "https://github.com/agent-squid/squid"

[project.scripts]
agentsquid = "agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.hatch.build.targets.wheel.force-include]
"ui" = "ui"
"config" = "config"
# Only the intended default-seed subset of context/ — not the whole
# directory. context/ doubles as this repo's own dogfooded topic data
# (gitignored via context/topics/* and context/journals/), so a blanket
# include would risk shipping local/private content in a public wheel.
# This mirrors exactly what's git-tracked under context/.
"context/README.md" = "context/README.md"
"context/roles" = "context/roles"
"context/topics/default" = "context/topics/default"

[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
