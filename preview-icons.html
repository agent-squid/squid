<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squid Icon Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101015;
      --panel: #171820;
      --line: #2b2d3a;
      --text: #e5e5ea;
      --muted: #9a9aaa;
      --accent: #9db5ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .item {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 14px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn {
      width: 32px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #383a48;
      border-radius: 5px;
      color: var(--muted);
      background: #12131a;
    }
    .btn.active {
      color: var(--accent);
      border-color: #55638f;
      background: #182033;
    }
    svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    .name {
      font-weight: 600;
    }
    code {
      color: var(--muted);
      font: 12px/1.4 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
</head>
<body>
  <main>
    <h1>Prompt Toggle Icon Options</h1>
    <p>Small SVG options for a user-prompts-only history toggle.</p>

    <section class="grid">
      <article class="item">
        <div class="row">
          <span class="btn active" title="User prompts only">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2.2 3.1c0-.9.7-1.6 1.6-1.6h8.4c.9 0 1.6.7 1.6 1.6v5.5c0 .9-.7 1.6-1.6 1.6H7.1L3.5 13v-2.8c-.7-.1-1.3-.8-1.3-1.6V3.1zm1.4 0v5.5c0 .2.2.3.3.3h1v1.2l1.7-1.2h5.6c.2 0 .3-.2.3-.3V3.1c0-.2-.2-.3-.3-.3H3.9c-.1 0-.3.1-.3.3z"/>
              <path d="M8 4.1a1.4 1.4 0 1 1 0 2.8a1.4 1.4 0 0 1 0-2.8zm-2.6 4c.4-1 1.3-1.5 2.6-1.5s2.2.5 2.6 1.5H5.4z"/>
            </svg>
          </span>
          <span class="name">User in bubble</span>
        </div>
        <code>Best fit: "messages from me"</code>
      </article>

      <article class="item">
        <div class="row">
          <span class="btn" title="User prompts only">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M3.2 2.2h9.6v1.4H3.2V2.2zm0 5h9.6v1.4H3.2V7.2zm0 5h9.6v1.4H3.2v-1.4z"/>
              <path d="M1.2 2.1h1.2v1.6H1.2V2.1zm0 5h1.2v1.6H1.2V7.1zm0 5h1.2v1.6H1.2v-1.6z"/>
            </svg>
          </span>
          <span class="name">Prompt list</span>
        </div>
        <code>Good for overview/list mode</code>
      </article>

      <article class="item">
        <div class="row">
          <span class="btn" title="User prompts only">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2 3.2c0-.9.7-1.6 1.6-1.6h8.8c.9 0 1.6.7 1.6 1.6v5.4c0 .9-.7 1.6-1.6 1.6H7l-3.7 2.9v-2.9C2.6 10 2 9.4 2 8.6V3.2zm1.4 0v5.4c0 .2.1.3.3.3h1v1.3L6.5 9h5.9c.2 0 .3-.1.3-.3V3.2c0-.2-.1-.3-.3-.3H3.7c-.2 0-.3.1-.3.3z"/>
            </svg>
          </span>
          <span class="name">Chat bubble</span>
        </div>
        <code>Simple, but less specific</code>
      </article>

      <article class="item">
        <div class="row">
          <span class="btn" title="Preview in browser">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 2.5h9.5V12H12V5.1l-8.2 8.2l-1.1-1.1l8.2-8.2H4V2.5z"/>
            </svg>
          </span>
          <span class="name">Preview/open</span>
        </div>
        <code>For the file viewer preview button</code>
      </article>
    </section>
  </main>
</body>
</html>
