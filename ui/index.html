<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f13" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Squid" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Squid</title>
  <link rel="manifest" href="/manifest.webmanifest?v=20260523-1" />
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="style.css?v=20260523-15" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <img src="squid.jpg" id="logo" alt="Squid" />
      <span id="logo-name">agent-squid</span>
      <div id="quota-display" title="Session usage · click for credentials"></div>
      <button id="stats-btn" type="button" title="Usage stats">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
          <rect x="1" y="7" width="3" height="6" rx="0.5"/>
          <rect x="5.5" y="3.5" width="3" height="9.5" rx="0.5"/>
          <rect x="10" y="1" width="3" height="12" rx="0.5"/>
        </svg>
      </button>
      <div id="quota-creds-popup">
        <span class="settings-label">Claude.ai session</span>
        <input id="creds-org" type="text" placeholder="Org ID" spellcheck="false" />
        <input id="creds-key" type="password" placeholder="Session key" />
        <button id="creds-save" type="button">Save</button>
        <span id="creds-status"></span>
      </div>
    </header>

    <!-- Stats panel -->
    <div id="stats-panel">
      <div id="stats-header">
        <div id="stats-tabs">
          <button class="st active" data-period="daily" data-group="time">Daily</button>
          <button class="st" data-period="hourly" data-group="time">Hourly</button>
          <button class="st" data-period="" data-group="topic">By Topic</button>
          <button class="st" data-period="" data-group="model">By Model</button>
          <button class="st" data-period="" data-group="proc">Live</button>
        </div>
        <button id="stats-close" type="button">✕</button>
      </div>
      <div id="stats-content"></div>
    </div>

    <div id="messages"></div>
    <div id="scroll-btn" role="button" aria-label="Scroll to bottom">↓</div>

    <div id="cmd-panel">
      <div id="cmd-panel-header">
        <span class="settings-label">Topics</span>
        <button id="cmd-panel-close" type="button" aria-label="Close topic list">✕</button>
      </div>
      <div id="cmd-panel-content"></div>
    </div>

    <div id="settings-bar">
      <div id="settings-aliases">
        <span class="settings-label">Model Aliases</span>
        <div id="aliases-list"></div>
        <form id="alias-form">
          <div class="alias-form-row">
            <input id="af-name"    type="text" placeholder="name" spellcheck="false" required />
            <select id="af-backend">
              <option value="auto">auto</option>
              <option value="claude">claude</option>
              <option value="cursor">cursor</option>
              <option value="codex">codex</option>
              <option value="copilot">copilot</option>
            </select>
            <input id="af-model"   type="text" placeholder="model (e.g. gpt-4o)" spellcheck="false" />
            <input id="af-cwd"     type="text"   placeholder="/tmp/squid/…" spellcheck="false" />
            <input id="af-timeout" type="number" placeholder="timeout (s)" min="10" />
            <button type="submit">Save</button>
            <span id="alias-form-status"></span>
          </div>
        </form>
      </div>
      <div id="settings-lookback">
        <span class="settings-label">Lookback</span>
        <div id="lookback-control">
          <button class="lb" data-val="0">Off</button>
          <button class="lb" data-val="1">1</button>
          <button class="lb" data-val="2">2</button>
          <button class="lb" data-val="3">3</button>
          <button class="lb active" data-val="5">5</button>
          <button class="lb" data-val="10">10</button>
          <button class="lb" data-val="all">All</button>
        </div>
        <span class="settings-hint">exchanges per topic sent as context</span>
        <button id="reset-pins-btn" type="button">Reset pins</button>
      </div>
    </div>

    <div id="autocomplete"></div>
    <form id="form">
      <div id="input-area">
        <div id="topic-chip"></div>
        <textarea id="input" placeholder="#topic or #topic@alias message…" rows="1"></textarea>
      </div>
      <button id="settings-btn" type="button" title="Settings">⚙</button>
      <button id="send-btn" type="submit" aria-label="Send message">
        <span class="send-label">Send</span>
        <svg class="send-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M3 9h11M10 5l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>
  <script src="app.js?v=20260523-20"></script>
</body>
</html>
