name: Update AgentSquid Site Playground

on:
  push:
    branches: [main]
    paths:
      - "ui/flow-lang.js"
      - "ui/flow-playground.html"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger agentsquid.ai deploy
        env:
          GH_TOKEN: ${{ secrets.AGENTSQUID_SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Missing AGENTSQUID_SITE_DISPATCH_TOKEN secret; skipping agentsquid.ai deploy trigger"
            exit 0
          fi
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/agent-squid/agentsquid.ai/dispatches \
            --data '{"event_type":"squid-playground-updated","client_payload":{"squid_sha":"${{ github.sha }}"}}'
