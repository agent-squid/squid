name: Validate Mermaid diagrams

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-mermaid.mjs"
      - ".github/workflows/validate-mermaid.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/check-mermaid.mjs"
      - ".github/workflows/validate-mermaid.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Mermaid parser
        run: npm install --prefix "$RUNNER_TEMP/mermaid" --ignore-scripts mermaid@11.12.0
      - name: Parse Mermaid blocks
        env:
          MERMAID_MODULE: ${{ runner.temp }}/mermaid/node_modules/mermaid/dist/mermaid.esm.mjs
        run: find . -name '*.md' -not -path './.git/*' -print0 | xargs -0 node scripts/check-mermaid.mjs
