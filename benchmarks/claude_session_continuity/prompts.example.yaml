workspace:
  # Each arm receives a detached worktree at this ref. The source worktree is
  # never modified.
  source: ~/Work/squid
  baseline: HEAD
  keep_worktrees: false

execution:
  # Reverse this list in the second trial to reduce order bias.
  order: [resumed, persistent]
  claude_bin: claude
  model: sonnet
  effort: medium
  permission_mode: acceptEdits
  allowed_tools: [Read, Edit, Write, Bash]
  prompt_timeout_seconds: 600
  capture_debug: true
  extra_args: []
  env: {}

measurement:
  cold_cache_seconds: 600
  gauge_poll_seconds: 10
  gauge_stable_samples: 3
  gauge_epsilon: 0.001
  gauge_timeout_seconds: 180

prompts:
  - |
    Complete this self-contained Python coding task. Do not inspect or modify files
    outside benchmark_outputs/01_lru_cache.

    Create benchmark_outputs/01_lru_cache/solution.py implementing an LRUCache
    class with get(key) and put(key, value). get returns -1 for a missing key.
    put updates an existing key or inserts a new one; when capacity is exceeded,
    evict the least recently used key. Both operations must be O(1). Capacity is
    always a positive integer. Use only the Python 3.11 standard library.

    Also create benchmark_outputs/01_lru_cache/test_solution.py with focused
    unittest tests for normal eviction, updating an existing key, and capacity 1.
    Run the tests, fix failures, and finish with a concise summary.
  - |
    Complete this independent, self-contained Python coding task. Do not inspect
    or modify files outside benchmark_outputs/02_merge_intervals.

    Create benchmark_outputs/02_merge_intervals/solution.py implementing
    merge_intervals(intervals), where intervals is a list of [start, end] integer
    pairs with start <= end. Return a new list containing all overlapping or
    touching intervals merged, sorted by start. Do not mutate the input. An empty
    input returns an empty list. Use only the Python 3.11 standard library.

    Also create benchmark_outputs/02_merge_intervals/test_solution.py with focused
    unittest tests for empty input, unsorted overlapping intervals, touching
    endpoints, nested intervals, and input preservation. Run the tests, fix
    failures, and finish with a concise summary.
  - |
    Complete this independent, self-contained Python coding task. Do not inspect
    or modify files outside benchmark_outputs/03_sliding_window_maximum.

    Create benchmark_outputs/03_sliding_window_maximum/solution.py implementing
    sliding_window_maximum(values, k). Return the maximum for every contiguous
    window of size k in O(n) time without mutating values. For an empty values
    list return []; otherwise raise ValueError when k < 1 or k > len(values).
    Use only the Python 3.11 standard library.

    Also create test_solution.py in that directory with focused unittest tests
    for the standard example, duplicate and negative values, boundary window
    sizes, empty input, invalid sizes, and input preservation. Run the tests, fix
    failures, and finish with a concise summary.
  - |
    Complete this independent, self-contained Python coding task. Do not inspect
    or modify files outside benchmark_outputs/04_topological_sort.

    Create benchmark_outputs/04_topological_sort/solution.py implementing
    topological_sort(graph), where graph maps string task names to iterables of
    prerequisite task names. Include prerequisites absent as keys. Return a valid
    ordering, choosing the lexicographically smallest currently available task at
    every step. Raise ValueError for a cycle and do not mutate graph. Use only the
    Python 3.11 standard library.

    Also create test_solution.py in that directory with focused unittest tests
    for empty and disconnected graphs, missing prerequisite keys, deterministic
    tie-breaking, cycles, and input preservation. Run the tests, fix failures,
    and finish with a concise summary.
  - |
    Complete this independent, self-contained Python coding task. Do not inspect
    or modify files outside benchmark_outputs/05_trie.

    Create benchmark_outputs/05_trie/solution.py implementing a Trie class with
    insert(word), search(word), and starts_with(prefix). Inputs are arbitrary
    Python strings, including the empty string. A newly constructed trie does not
    contain the empty string; inserting it makes search("") true. All operations
    must be O(m) for input length m. Use only the Python 3.11 standard library.

    Also create test_solution.py in that directory with focused unittest tests
    for exact versus prefix matches, duplicate insertion, empty strings, and
    case-sensitive behavior. Run the tests, fix failures, and finish with a
    concise summary.
  - |
    Complete this independent, self-contained Python coding task. Do not inspect
    or modify files outside benchmark_outputs/06_running_median.

    Create benchmark_outputs/06_running_median/solution.py implementing a
    RunningMedian class with add(value) and median(). add must take O(log n) time
    and median O(1) time. For an odd count return the middle value; for an even
    count return the arithmetic mean of the middle values. median() must raise
    ValueError when empty. Values are finite ints or floats. Use only the Python
    3.11 standard library.

    Also create test_solution.py in that directory with focused unittest tests
    for empty state, incremental odd and even medians, duplicates, negative
    values, and independent instances. Run the tests, fix failures, and finish
    with a concise summary.
  - |
    Complete this independent, self-contained Python coding task. Do not inspect
    or modify files outside benchmark_outputs/07_group_anagrams.

    Create benchmark_outputs/07_group_anagrams/solution.py implementing
    group_anagrams(words). Group strings that are exact case-sensitive anagrams.
    Preserve input order inside each group and order groups by the first member's
    appearance. Return a new list and do not mutate words. Empty strings and
    duplicate strings are valid. Use only the Python 3.11 standard library.

    Also create test_solution.py in that directory with focused unittest tests
    for empty input, multiple groups, duplicates, empty strings, case sensitivity,
    and input preservation. Run the tests, fix failures, and finish with a concise
    summary.
