workspace:
  # Each arm receives a detached worktree at this ref. The source worktree is
  # never modified.
  source: ~/Work/squid
  baseline: HEAD
  keep_worktrees: false

execution:
  # Reverse this list in the second trial to reduce order bias.
  order: [resumed, persistent]
  claude_bin: claude
  model: sonnet
  effort: medium
  permission_mode: acceptEdits
  allowed_tools: [Read, Edit, Write, Bash]
  prompt_timeout_seconds: 600
  capture_debug: true
  extra_args: []
  env: {}

measurement:
  cold_cache_seconds: 600
  gauge_poll_seconds: 10
  gauge_stable_samples: 3
  gauge_epsilon: 0.001
  gauge_timeout_seconds: 180

prompts:
  - |
    Complete this self-contained Python coding task. Do not inspect or modify files
    outside benchmark_outputs/01_lru_cache.

    Create benchmark_outputs/01_lru_cache/solution.py implementing an LRUCache
    class with get(key) and put(key, value). get returns -1 for a missing key.
    put updates an existing key or inserts a new one; when capacity is exceeded,
    evict the least recently used key. Both operations must be O(1). Capacity is
    always a positive integer. Use only the Python 3.11 standard library.

    Also create benchmark_outputs/01_lru_cache/test_solution.py with focused
    unittest tests for normal eviction, updating an existing key, and capacity 1.
    Run the tests, fix failures, and finish with a concise summary.
  - |
    Complete this independent, self-contained Python coding task. Do not inspect
    or modify files outside benchmark_outputs/02_merge_intervals.

    Create benchmark_outputs/02_merge_intervals/solution.py implementing
    merge_intervals(intervals), where intervals is a list of [start, end] integer
    pairs with start <= end. Return a new list containing all overlapping or
    touching intervals merged, sorted by start. Do not mutate the input. An empty
    input returns an empty list. Use only the Python 3.11 standard library.

    Also create benchmark_outputs/02_merge_intervals/test_solution.py with focused
    unittest tests for empty input, unsorted overlapping intervals, touching
    endpoints, nested intervals, and input preservation. Run the tests, fix
    failures, and finish with a concise summary.
