<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 Rocket vs Asteroids 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; cursor: none; }
canvas { display: block; }
#hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding: 15px 30px; z-index: 10; pointer-events: none;
  background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
}
#hud > div { color: #fff; font-size: 18px; text-shadow: 0 0 10px rgba(0,150,255,0.8); }
#lives { font-size: 24px; }
#healthBar {
  width: 200px; height: 12px; background: #333; border-radius: 6px;
  overflow: hidden; border: 1px solid #555;
}
#healthFill {
  height: 100%; width: 100%; background: linear-gradient(90deg, #ff3333, #ff6666);
  transition: width 0.3s; border-radius: 6px;
}
#waveText {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  color: #fff; font-size: 48px; z-index: 20; pointer-events: none;
  text-shadow: 0 0 30px rgba(0,150,255,1); opacity: 0;
  transition: opacity 0.5s;
}
#overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.85); z-index: 30;
}
#overlay.hidden { display: none; }
#overlay h1 {
  font-size: 56px; color: #fff; margin-bottom: 10px;
  text-shadow: 0 0 30px rgba(0,150,255,1);
}
#overlay h2 {
  font-size: 36px; color: #ff4444; margin-bottom: 10px;
  text-shadow: 0 0 20px rgba(255,0,0,0.8);
}
#overlay p {
  font-size: 18px; color: #aaa; margin-bottom: 30px; text-align: center; line-height: 1.6;
}
#overlay button {
  padding: 15px 50px; font-size: 22px; border: 2px solid #0af;
  background: rgba(0,100,200,0.3); color: #fff; border-radius: 8px;
  cursor: pointer; transition: all 0.3s; pointer-events: all;
}
#overlay button:hover {
  background: rgba(0,150,255,0.6); box-shadow: 0 0 30px rgba(0,150,255,0.5);
}
.controls-info { font-size: 14px !important; color: #777 !important; margin-top: 20px !important; }
#crosshair {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 30px; height: 30px; z-index: 15; pointer-events: none;
}
#crosshair::before, #crosshair::after {
  content: ''; position: absolute; background: rgba(0,200,255,0.7);
}
#crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
#crosshair::after { height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }
#minimap {
  position: fixed; bottom: 20px; right: 20px; width: 150px; height: 150px;
  border: 2px solid rgba(0,150,255,0.5); border-radius: 50%; z-index: 10;
  background: rgba(0,0,0,0.5); pointer-events: none;
}
#scoreDisplay { color: #ffaa00 !important; }
#bossWarning {
  position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%);
  color: #ff0000; font-size: 42px; font-weight: bold; z-index: 25;
  pointer-events: none; opacity: 0;
  text-shadow: 0 0 30px rgba(255,0,0,1);
  animation: none;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>
<div id="hud">
  <div id="lives">❤️❤️</div>
  <div id="waveInfo">Wave: <span id="waveNum">1</span></div>
  <div id="scoreDisplay">Score: <span id="score">0</span></div>
  <div id="healthBar"><div id="healthFill"></div></div>
</div>
<div id="crosshair"></div>
<div id="waveText"></div>
<div id="bossWarning">⚠️ BOSS INCOMING ⚠️</div>

<div id="overlay">
  <h1>🚀 ROCKET vs ASTEROIDS</h1>
  <p>Survive the asteroid fields and defeat the Boss Asteroid!<br>
  You have <strong>2 lives</strong>. Don't get hit!</p>
  <button id="startBtn">START MISSION</button>
  <p class="controls-info">
    WASD / Arrow Keys — Move &nbsp;|&nbsp; Mouse — Aim &nbsp;|&nbsp; Click / Space — Shoot<br>
    Shift — Boost
  </p>
</div>

<canvas id="minimap"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============ GAME STATE ============
const STATE = {
  MENU: 0, PLAYING: 1, WAVE_TRANSITION: 2, GAME_OVER: 3, VICTORY: 4, BOSS_WARNING: 5
};

let gameState = STATE.MENU;
let score = 0;
let lives = 2;
let health = 100;
let currentWave = 1;
let maxWaves = 3;
let asteroids = [];
let lasers = [];
let enemyLasers = [];
let particles = [];
let stars = [];
let bossAsteroid = null;
let bossActive = false;
let waveAsteroidCount = 0;
let waveAsteroidsAlive = 0;
let bossWarningTimer = 0;

// ============ THREE.JS SETUP ============
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000011, 0.0008);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// ============ LIGHTING ============
const ambientLight = new THREE.AmbientLight(0x334466, 0.5);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
sunLight.position.set(100, 100, 50);
scene.add(sunLight);

const pointLight = new THREE.PointLight(0x0088ff, 2, 100);
scene.add(pointLight);

// ============ STARFIELD ============
function createStarfield() {
  const geo = new THREE.BufferGeometry();
  const positions = [];
  for (let i = 0; i < 5000; i++) {
    positions.push(
      (Math.random() - 0.5) * 2000,
      (Math.random() - 0.5) * 2000,
      (Math.random() - 0.5) * 2000
    );
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, sizeAttenuation: true });
  const starSystem = new THREE.Points(geo, mat);
  scene.add(starSystem);
  return starSystem;
}
const starfield = createStarfield();

// ============ NEBULA BACKGROUND ============
function createNebula() {
  const colors = [0x1a0033, 0x001144, 0x330022, 0x002233];
  colors.forEach((c, i) => {
    const geo = new THREE.PlaneGeometry(600, 600);
    const mat = new THREE.MeshBasicMaterial({
      color: c, transparent: true, opacity: 0.15,
      side: THREE.DoubleSide, depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(
      (Math.random() - 0.5) * 400,
      (Math.random() - 0.5) * 200,
      -300 - Math.random() * 200
    );
    mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    scene.add(mesh);
  });
}
createNebula();

// ============ ROCKET PLAYER ============
const rocketGroup = new THREE.Group();

// Rocket body
const bodyGeo = new THREE.CylinderGeometry(0.5, 0.7, 3, 8);
const bodyMat = new THREE.MeshPhongMaterial({ color: 0xcccccc, shininess: 100 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.rotation.x = Math.PI / 2;
rocketGroup.add(body);

// Nose cone
const noseGeo = new THREE.ConeGeometry(0.5, 1.5, 8);
const noseMat = new THREE.MeshPhongMaterial({ color: 0xff3333, shininess: 80 });
const nose = new THREE.Mesh(noseGeo, noseMat);
nose.rotation.x = Math.PI / 2;
nose.position.z = 2.25;
rocketGroup.add(nose);

// Fins
const finGeo = new THREE.BoxGeometry(0.1, 1.2, 0.8);
const finMat = new THREE.MeshPhongMaterial({ color: 0xff6600 });
for (let i = 0; i < 4; i++) {
  const fin = new THREE.Mesh(finGeo, finMat);
  const angle = (i / 4) * Math.PI * 2;
  fin.position.set(Math.cos(angle) * 0.6, Math.sin(angle) * 0.6, -1.2);
  fin.rotation.z = angle;
  rocketGroup.add(fin);
}

// Engine glow
const engineGeo = new THREE.SphereGeometry(0.4, 8, 8);
const engineMat = new THREE.MeshBasicMaterial({ color: 0x00aaff });
const engine = new THREE.Mesh(engineGeo, engineMat);
engine.position.z = -1.8;
rocketGroup.add(engine);

// Engine flame
const flameGeo = new THREE.ConeGeometry(0.3, 2, 8);
const flameMat = new THREE.MeshBasicMaterial({ color: 0x0066ff, transparent: true, opacity: 0.7 });
const flame = new THREE.Mesh(flameGeo, flameMat);
flame.rotation.x = Math.PI / 2;
flame.position.z = -3.2;
rocketGroup.add(flame);

// Engine light
const engineLight = new THREE.PointLight(0x0088ff, 3, 20);
engineLight.position.z = -2;
rocketGroup.add(engineLight);

scene.add(rocketGroup);

// ============ CAMERA (third person) ============
const cameraOffset = new THREE.Vector3(0, 4, 10);
const cameraLookOffset = new THREE.Vector3(0, 0, 5);

// ============ INPUT ============
const keys = {};
let mouseX = 0, mouseY = 0;
let mouseDown = false;
let shootCooldown = 0;

document.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.code] = false; });

document.addEventListener('mousemove', e => {
  mouseX = (e.clientX / window.innerWidth) * 2 - 1;
  mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
});

document.addEventListener('mousedown', () => { mouseDown = true; });
document.addEventListener('mouseup', () => { mouseDown = false; });
document.addEventListener('click', () => {
  if (gameState === STATE.PLAYING) renderer.domElement.requestPointerLock();
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && gameState === STATE.PLAYING) {
    shoot();
    e.preventDefault();
  }
});

// ============ ASTEROID CREATION ============
function createAsteroidGeometry(size) {
  const geo = new THREE.DodecahedronGeometry(size, 2);
  const positions = geo.attributes.position;
  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i);
    const y = positions.getY(i);
    const z = positions.getZ(i);
    const noise = 1 + (Math.random() - 0.5) * 0.4;
    positions.setXYZ(i, x * noise, y * noise, z * noise);
  }
  geo.computeVertexNormals();
  return geo;
}

function createAsteroid(x, y, z, size, speed, isBoss = false) {
  const geo = createAsteroidGeometry(size);
  const hue = isBoss ? 0.1 : Math.random() * 0.15 + 0.05;
  const mat = new THREE.MeshPhongMaterial({
    color: new THREE.Color().setHSL(hue, 0.3, 0.3 + Math.random() * 0.2),
    flatShading: true,
    shininess: 10
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);

  // Add surface details
  const detailGeo = createAsteroidGeometry(size * 0.5);
  const detailMat = new THREE.MeshPhongMaterial({
    color: new THREE.Color().setHSL(hue, 0.2, 0.2),
    flatShading: true
  });
  const detail = new THREE.Mesh(detailGeo, detailMat);
  mesh.add(detail);

  const asteroid = {
    mesh,
    velocity: new THREE.Vector3(),
    angularVel: new THREE.Vector3(
      (Math.random() - 0.5) * 2,
      (Math.random() - 0.5) * 2,
      (Math.random() - 0.5) * 2
    ),
    size,
    isBoss,
    health: isBoss ? 50 : 1,
    shootTimer: 0,
    laserCooldown: isBoss ? 0.5 : 0
  };

  // Move towards player area
  if (!isBoss) {
    const dir = new THREE.Vector3(
      (Math.random() - 0.5) * 2,
      (Math.random() - 0.5) * 2,
      -0.5 - Math.random() * 0.5
    ).normalize();
    asteroid.velocity.copy(dir.multiplyScalar(speed));
  }

  scene.add(mesh);
  asteroids.push(asteroid);
  return asteroid;
}

// ============ LASER CREATION ============
function createLaser(from, direction, isEnemy = false) {
  const length = 3;
  const radius = isEnemy ? 0.08 : 0.06;
  const geo = new THREE.CylinderGeometry(radius, radius, length, 6);
  const color = isEnemy ? 0xff0044 : 0x00ffaa;
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 });
  const mesh = new THREE.Mesh(geo, mat);

  // Glow effect
  const glowGeo = new THREE.CylinderGeometry(radius * 2.5, radius * 2.5, length * 1.2, 6);
  const glowMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.3 });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  mesh.add(glow);

  // Light
  const light = new THREE.PointLight(color, isEnemy ? 2 : 1, 10);
  mesh.add(light);

  mesh.position.copy(from);
  mesh.lookAt(from.clone().add(direction));
  mesh.rotateX(Math.PI / 2);

  scene.add(mesh);

  const laser = {
    mesh,
    velocity: direction.clone().normalize().multiplyScalar(isEnemy ? 1.5 : 4),
    isEnemy,
    life: 10,
    damage: isEnemy ? 25 : 1
  };
  (isEnemy ? enemyLasers : lasers).push(laser);
  return laser;
}

function shoot() {
  if (shootCooldown > 0) return;
  shootCooldown = 0.15;

  const dir = new THREE.Vector3(mouseX, mouseY, -1).normalize();
  const from = rocketGroup.position.clone().add(
    new THREE.Vector3(0, 0, 3).applyQuaternion(rocketGroup.quaternion)
  );

  createLaser(from, dir);

  // Recoil effect
  engine.scale.set(1 + Math.random() * 0.3, 1 + Math.random() * 0.3, 1.5);
}

// ============ PARTICLES ============
function createExplosion(position, color, count = 20) {
  for (let i = 0; i < count; i++) {
    const geo = new THREE.SphereGeometry(0.1 + Math.random() * 0.2, 4, 4);
    const mat = new THREE.MeshBasicMaterial({
      color, transparent: true, opacity: 1
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(position);

    const vel = new THREE.Vector3(
      (Math.random() - 0.5) * 3,
      (Math.random() - 0.5) * 3,
      (Math.random() - 0.5) * 3
    );

    scene.add(mesh);
    particles.push({ mesh, velocity: vel, life: 1, decay: 0.01 + Math.random() * 0.02 });
  }
}

function createTrail(position) {
  const geo = new THREE.SphereGeometry(0.15, 4, 4);
  const mat = new THREE.MeshBasicMaterial({
    color: 0x0088ff, transparent: true, opacity: 0.6
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(position);
  scene.add(mesh);
  particles.push({ mesh, velocity: new THREE.Vector3(0, 0, 0.5), life: 0.5, decay: 0.02 });
}

// ============ WAVE SYSTEM ============
function spawnWave(wave) {
  const count = 5 + wave * 3;
  waveAsteroidCount = count;
  waveAsteroidsAlive = count;

  showWaveText(`WAVE ${wave}`);

  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      if (gameState !== STATE.PLAYING) return;
      const angle = Math.random() * Math.PI * 2;
      const dist = 80 + Math.random() * 40;
      const x = Math.cos(angle) * dist;
      const y = (Math.random() - 0.5) * 60;
      const z = -100 - Math.random() * 100;
      const size = 1.5 + Math.random() * 2;
      const speed = 0.3 + wave * 0.15 + Math.random() * 0.2;
      createAsteroid(x, y, z, size, speed);
    }, i * 500);
  }

  // Boss after final wave
  if (wave >= maxWaves) {
    setTimeout(() => {
      if (gameState !== STATE.PLAYING) return;
      triggerBoss();
    }, count * 500 + 2000);
  }
}

function triggerBoss() {
  gameState = STATE.BOSS_WARNING;
  bossWarningTimer = 3;
  const warning = document.getElementById('bossWarning');
  warning.style.opacity = '1';
  warning.style.animation = 'pulse 0.5s infinite';
}

function spawnBoss() {
  bossActive = true;
  const boss = createAsteroid(0, 0, -200, 12, 0.2, true);
  boss.mesh.material = new THREE.MeshPhongMaterial({
    color: 0x880000,
    emissive: 0x440000,
    flatShading: true,
    shininess: 30
  });

  // Boss eye
  const eyeGeo = new THREE.SphereGeometry(2, 16, 16);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
  const eye = new THREE.Mesh(eyeGeo, eyeMat);
  eye.position.set(0, 2, 8);
  boss.mesh.add(eye);

  // Boss glow
  const bossLight = new THREE.PointLight(0xff0000, 5, 100);
  bossLight.position.z = 10;
  boss.mesh.add(bossLight);

  bossAsteroid = boss;
  showWaveText('⚠️ BOSS BATTLE ⚠️');
}

function showWaveText(text) {
  const el = document.getElementById('waveText');
  el.textContent = text;
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 2000);
}

// ============ COLLISION DETECTION ============
function checkCollisions() {
  // Lasers vs asteroids
  for (let i = lasers.length - 1; i >= 0; i--) {
    const laser = lasers[i];
    for (let j = asteroids.length - 1; j >= 0; j--) {
      const asteroid = asteroids[j];
      const dist = laser.mesh.position.distanceTo(asteroid.mesh.position);
      if (dist < asteroid.size + 1) {
        createExplosion(asteroid.mesh.position, 0xffaa44, 15);
        scene.remove(laser.mesh);
        lasers.splice(i, 1);

        asteroid.health--;
        if (asteroid.health <= 0) {
          createExplosion(asteroid.mesh.position, 0xff6622, 30);
          scene.remove(asteroid.mesh);
          asteroids.splice(j, 1);
          score += asteroid.isBoss ? 10000 : 100;
          waveAsteroidsAlive--;
          updateHUD();
        }
        break;
      }
    }
  }

  // Enemy lasers vs player
  for (let i = enemyLasers.length - 1; i >= 0; i--) {
    const laser = enemyLasers[i];
    const dist = laser.mesh.position.distanceTo(rocketGroup.position);
    if (dist < 2) {
      createExplosion(laser.mesh.position, 0xff0044, 10);
      scene.remove(laser.mesh);
      enemyLasers.splice(i, 1);
      damagePlayer(15);
    }
  }

  // Asteroids vs player
  for (let i = asteroids.length - 1; i >= 0; i--) {
    const asteroid = asteroids[i];
    const dist = asteroid.mesh.position.distanceTo(rocketGroup.position);
    if (dist < asteroid.size + 1) {
      createExplosion(asteroid.mesh.position, 0xff8844, 25);
      scene.remove(asteroid.mesh);
      asteroids.splice(i, 1);
      waveAsteroidsAlive--;
      damagePlayer(34);
    }
  }

  // Boss laser spawn
  if (bossAsteroid && bossActive) {
    bossAsteroid.shootTimer += 0.016;
    if (bossAsteroid.shootTimer > bossAsteroid.laserCooldown) {
      bossAsteroid.shootTimer = 0;
      const dir = rocketGroup.position.clone().sub(bossAsteroid.mesh.position).normalize();
      // Add some spread
      dir.x += (Math.random() - 0.5) * 0.3;
      dir.y += (Math.random() - 0.5) * 0.3;
      dir.normalize();
      const from = bossAsteroid.mesh.position.clone();
      from.z += 10;
      createLaser(from, dir, true);
    }
  }
}

function damagePlayer(amount) {
  health -= amount;
  health = Math.max(0, health);
  updateHUD();

  // Screen shake
  camera.position.x += (Math.random() - 0.5) * 2;
  camera.position.y += (Math.random() - 0.5) * 2;

  if (health <= 0) {
    loseLife();
  }
}

function loseLife() {
  lives--;
  updateHUD();

  if (lives <= 0) {
    gameOver();
  } else {
    health = 100;
    updateHUD();
    // Respawn
    rocketGroup.position.set(0, 0, 0);
    rocketGroup.rotation.set(0, 0, 0);
    createExplosion(rocketGroup.position, 0x0088ff, 30);
  }
}

function gameOver() {
  gameState = STATE.GAME_OVER;
  document.exitPointerLock();
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h2>💀 GAME OVER</h2>
    <p>Final Score: <strong style="color:#ffaa00;font-size:24px">${score}</strong><br>
    Reached Wave: ${currentWave}</p>
    <button id="restartBtn">TRY AGAIN</button>
  `;
  document.getElementById('restartBtn').addEventListener('click', startGame);
}

function victory() {
  gameState = STATE.VICTORY;
  document.exitPointerLock();
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h1>🎉 MISSION COMPLETE!</h1>
    <p>You destroyed the Boss Asteroid!<br>
    Final Score: <strong style="color:#ffaa00;font-size:24px">${score}</strong></p>
    <button id="playAgainBtn">PLAY AGAIN</button>
  `;
  document.getElementById('playAgainBtn').addEventListener('click', startGame);
}

// ============ HUD ============
function updateHUD() {
  const livesEl = document.getElementById('lives');
  livesEl.textContent = '❤️'.repeat(Math.max(0, lives));

  document.getElementById('score').textContent = score;
  document.getElementById('waveNum').textContent = currentWave;

  const healthFill = document.getElementById('healthFill');
  healthFill.style.width = health + '%';
  if (health > 60) healthFill.style.background = 'linear-gradient(90deg, #00ff66, #00cc44)';
  else if (health > 30) healthFill.style.background = 'linear-gradient(90deg, #ffaa00, #ff8800)';
  else healthFill.style.background = 'linear-gradient(90deg, #ff3333, #cc0000)';
}

// ============ MINIMAP ============
const minimapCanvas = document.getElementById('minimap');
const minimapCtx = minimapCanvas.getContext('2d');
minimapCanvas.width = 150;
minimapCanvas.height = 150;

function updateMinimap() {
  minimapCtx.fillStyle = 'rgba(0,0,20,0.8)';
  minimapCtx.fillRect(0, 0, 150, 150);

  const cx = 75, cy = 75, scale = 0.5;

  // Player
  minimapCtx.fillStyle = '#00aaff';
  minimapCtx.beginPath();
  minimapCtx.arc(cx, cy, 4, 0, Math.PI * 2);
  minimapCtx.fill();

  // Asteroids
  asteroids.forEach(a => {
    const x = cx + a.mesh.position.x * scale;
    const y = cy + a.mesh.position.z * scale;
    if (x >= 0 && x <= 150 && y >= 0 && y <= 150) {
      minimapCtx.fillStyle = a.isBoss ? '#ff0000' : '#ff8844';
      minimapCtx.beginPath();
      minimapCtx.arc(x, y, a.isBoss ? 6 : 2, 0, Math.PI * 2);
      minimapCtx.fill();
    }
  });

  // Enemy lasers
  enemyLasers.forEach(l => {
    const x = cx + l.mesh.position.x * scale;
    const y = cy + l.mesh.position.z * scale;
    if (x >= 0 && x <= 150 && y >= 0 && y <= 150) {
      minimapCtx.fillStyle = '#ff0044';
      minimapCtx.fillRect(x - 1, y - 1, 2, 2);
    }
  });

  // Border circle
  minimapCtx.strokeStyle = 'rgba(0,150,255,0.5)';
  minimapCtx.lineWidth = 1;
  minimapCtx.beginPath();
  minimapCtx.arc(75, 75, 72, 0, Math.PI * 2);
  minimapCtx.stroke();
}

// ============ GAME LOOP ============
let lastTime = 0;
let playerVelocity = new THREE.Vector3();

function updatePlayer(dt) {
  const speed = keys['ShiftLeft'] || keys['ShiftRight'] ? 1.5 : 0.8;
  const accel = 2.0 * speed;
  const friction = 0.95;

  // Movement
  if (keys['KeyW'] || keys['ArrowUp']) playerVelocity.z -= accel * dt;
  if (keys['KeyS'] || keys['ArrowDown']) playerVelocity.z += accel * dt;
  if (keys['KeyA'] || keys['ArrowLeft']) playerVelocity.x -= accel * dt;
  if (keys['KeyD'] || keys['ArrowRight']) playerVelocity.x += accel * dt;

  // Up/Down
  if (keys['KeyQ']) playerVelocity.y -= accel * dt;
  if (keys['KeyE']) playerVelocity.y += accel * dt;

  // Apply friction
  playerVelocity.multiplyScalar(friction);

  // Clamp velocity
  playerVelocity.x = Math.max(-15, Math.min(15, playerVelocity.x));
  playerVelocity.y = Math.max(-15, Math.min(15, playerVelocity.y));
  playerVelocity.z = Math.max(-15, Math.min(15, playerVelocity.z));

  rocketGroup.position.add(playerVelocity.clone().multiplyScalar(dt * 60));

  // Camera-relative rotation from mouse
  const targetRotY = -mouseX * Math.8;
  const targetRotX = mouseY * 0.5;

  rocketGroup.rotation.y += (targetRotY - rocketGroup.rotation.y) * 0.1;
  rocketGroup.rotation.x += (targetRotX - rocketGroup.rotation.x) * 0.1;

  // Auto-fly forward (rocket always faces forward direction)
  const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(rocketGroup.quaternion);
  rocketGroup.position.add(forward.multiplyScalar(0.3 * speed));

  // Bank when turning
  rocketGroup.rotation.z = -playerVelocity.x * 0.05;

  // Engine flame animation
  flame.scale.y = 0.8 + Math.sin(Date.now() * 0.01) * 0.3;
  flame.scale.x = 0.8 + Math.cos(Date.now() * 0.015) * 0.2;
  engine.scale.set(
    0.8 + Math.random() * 0.4,
    0.8 + Math.random() * 0.4,
    1
  );

  // Trail particles
  if (Math.random() < 0.3) {
    createTrail(rocketGroup.position.clone().add(new THREE.Vector3(0, 0, -2)));
  }

  // Shooting
  if (mouseDown && gameState === STATE.PLAYING) shoot();
  shootCooldown = Math.max(0, shootCooldown - dt);

  // Camera follow
  const idealCamPos = rocketGroup.position.clone().add(cameraOffset);
  camera.position.lerp(idealCamPos, 0.05);

  const lookTarget = rocketGroup.position.clone().add(cameraLookOffset);
  camera.lookAt(lookTarget);

  // Update point light
  pointLight.position.copy(rocketGroup.position).add(new THREE.Vector3(0, 5, 5));

  // Boss movement
  if (bossAsteroid) {
    bossAsteroid.mesh.position.z += bossAsteroid.velocity.z * dt * 60;
    bossAsteroid.mesh.position.y += Math.sin(Date.now() * 0.001) * 0.1;
    bossAsteroid.mesh.rotation.y += 0.01;
    bossAsteroid.mesh.rotation.x += 0.005;

    // Boss moves toward player slowly
    const bossDir = rocketGroup.position.clone().sub(bossAsteroid.mesh.position);
    bossAsteroid.mesh.position.add(bossDir.normalize().multiplyScalar(0.05));
  }
}

function updateLasers() {
  // Player lasers
  for (let i = lasers.length - 1; i >= 0; i--) {
    const laser = lasers[i];
    laser.mesh.position.add(laser.velocity);
    laser.life--;
    if (laser.life <= 0 || laser.mesh.position.z < -500) {
      scene.remove(laser.mesh);
      lasers.splice(i, 1);
    }
  }

  // Enemy lasers
  for (let i = enemyLasers.length - 1; i >= 0; i--) {
    const laser = enemyLasers[i];
    laser.mesh.position.add(laser.velocity);
    laser.life--;
    if (laser.life <= 0) {
      scene.remove(laser.mesh);
      enemyLasers.splice(i, 1);
    }
  }
}

function updateAsteroids() {
  for (let i = asteroids.length - 1; i >= 0; i--) {
    const asteroid = asteroids[i];
    asteroid.mesh.position.add(asteroid.velocity.clone().multiplyScalar(0.016 * 60));
    asteroid.mesh.rotation.x += asteroid.angularVel.x * 0.016;
    asteroid.mesh.rotation.y += asteroid.angularVel.y * 0.016;
    asteroid.mesh.rotation.z += asteroid.angularVel.z * 0.016;

    // Remove if too far behind
    if (asteroid.mesh.position.z > rocketGroup.position.z + 50) {
      scene.remove(asteroid.mesh);
      asteroids.splice(i, 1);
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.mesh.position.add(p.velocity);
    p.life -= p.decay;
    p.mesh.material.opacity = p.life;
    p.mesh.scale.setScalar(p.life);
    if (p.life <= 0) {
      scene.remove(p.mesh);
      particles.splice(i, 1);
    }
  }
}

function checkWaveComplete() {
  if (gameState !== STATE.PLAYING) return;

  if (waveAsteroidsAlive <= 0 && asteroids.length === 0) {
    if (bossActive) {
      if (!bossAsteroid || bossAsteroid.health <= 0) {
        victory();
      }
    } else {
      currentWave++;
      if (currentWave > maxWaves) {
        victory();
      } else {
        spawnWave(currentWave);
      }
    }
  }
}

function gameLoop(time) {
  requestAnimationFrame(gameLoop);

  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;

  // Rotate starfield slowly
  starfield.rotation.y += 0.0001;

  if (gameState === STATE.PLAYING) {
    updatePlayer(dt);
    updateLasers();
    updateAsteroids();
    updateParticles(dt);
    checkCollisions();
    checkWaveComplete();
    updateMinimap();

    // Check if boss should spawn
    if (currentWave >= maxWaves && waveAsteroidsAlive <= 0 && asteroids.length === 0 && !bossActive) {
      triggerBoss();
    }
  } else if (gameState === STATE.BOSS_WARNING) {
    updateParticles(dt);
    updatePlayer(dt);
    bossWarningTimer -= dt;
    if (bossWarningTimer <= 0) {
      spawnBoss();
      gameState = STATE.PLAYING;
      bossActive = true;
      document.getElementById('bossWarning').style.opacity = '0';
    }
  } else if (gameState === STATE.MENU || gameState === STATE.GAME_OVER || gameState === STATE.VICTORY) {
    // Slow rotation of rocket in menu
    rocketGroup.rotation.y += 0.01;
    updateParticles(dt);
  }

  renderer.render(scene, camera);
}

// ============ GAME START ============
function startGame() {
  // Clear everything
  asteroids.forEach(a => scene.remove(a.mesh));
  lasers.forEach(l => scene.remove(l.mesh));
  enemyLasers.forEach(l => scene.remove(l.mesh));
  particles.forEach(p => scene.remove(p.mesh));
  if (bossAsteroid) scene.remove(bossAsteroid.mesh);

  asteroids = [];
  lasers = [];
  enemyLasers = [];
  particles = [];
  bossAsteroid = null;
  bossActive = false;

  score = 0;
  lives = 2;
  health = 100;
  currentWave = 1;
  rocketGroup.position.set(0, 0, 0);
  rocketGroup.rotation.set(0, 0, 0);
  playerVelocity.set(0, 0, 0);

  document.getElementById('overlay').classList.add('hidden');
  gameState = STATE.PLAYING;
  updateHUD();
  renderer.domElement.requestPointerLock();
  spawnWave(1);
}

// ============ START BUTTON ============
document.getElementById('startBtn').addEventListener('click', startGame);

// ============ RESIZE ============
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============ INIT ============
updateHUD();
requestAnimationFrame(gameLoop);
</script>
</body>
